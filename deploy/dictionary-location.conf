# Include inside the HTTPS server block for agent.harrylab.cn.
location = /dictionary {
    return 301 /dictionary/$is_args$args;
}
location ^~ /dictionary/ {
    alias /var/www/ai-coding-dictionary/current/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

# Run deploy/install-stats.sh before adding these exact API locations.
location = /dictionary/api/stats {
    proxy_pass http://127.0.0.1:8871/stats;
    proxy_read_timeout 10s;
    proxy_connect_timeout 3s;
    access_log off;
}
location = /dictionary/api/visit {
    proxy_pass http://127.0.0.1:8871/visit;
    proxy_read_timeout 10s;
    proxy_connect_timeout 3s;
    client_max_body_size 1k;
    access_log off;
}
