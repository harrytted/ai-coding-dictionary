# Include inside the HTTPS server block for agent.harrylab.cn.
location = /dictionary {
    return 301 /dictionary/$is_args$args;
}
location ^~ /dictionary/ {
    alias /var/www/ai-coding-dictionary/current/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}
